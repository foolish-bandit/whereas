name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Run TypeScript build check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Verify service worker excludes /api/*
        run: |
          test -f dist/sw.js
          grep -F "denylist:[/^\\/api\\//]" dist/sw.js

      - name: Audit frontend dependencies (production, high+ only)
        # Dev-only tooling (vite/vitest) is not shipped to users; gate on
        # production dependencies so the check stays actionable.
        run: npm audit --omit=dev --audit-level=high

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests
        run: pytest

      - name: Run backend lint
        run: ruff check .

      - name: Audit backend dependencies
        # PYSEC-2026-1325 (ecdsa, transitive via python-jose) has no fixed
        # release; ignored explicitly so the gate stays meaningful. Revisit
        # when python-jose drops ecdsa or a fixed version ships.
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2026-1325

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: dummy
          MINIO_ROOT_PASSWORD: dummy
          DOCUSEAL_AUTH_BRIDGE_SECRET: dummy
          DOCUSEAL_SECRET_KEY_BASE: dummy
          SECRET_KEY: dummy
          WHEREAS_INSTANCE_KEY: dummy
          NANGO_ENCRYPTION_KEY: dummy
          NANGO_SECRET_KEY: dummy
          NANGO_WEBHOOK_SECRET: dummy
          NANGO_DASHBOARD_PASSWORD: dummy

