name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Run TypeScript build check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Verify service worker excludes /api/*
        run: |
          test -f dist/sw.js
          grep -F "denylist:[/^\\/api\\//]" dist/sw.js

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests
        id: pytest
        run: |
          set +e
          pytest -v --tb=short -rfE 2>&1 | tee /tmp/pytest.log
          echo "${PIPESTATUS[0]}" > /tmp/pytest.exitcode
          exit $(cat /tmp/pytest.exitcode)

      - name: Post pytest output on failure
        if: failure() && steps.pytest.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Backend test failure (last 300 lines of pytest output)"
            echo
            echo '```'
            tail -300 /tmp/pytest.log
            echo '```'
          } > /tmp/pytest-comment.md
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/pytest-comment.md

      - name: Run backend lint
        run: ruff check .

