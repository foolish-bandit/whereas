name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Run TypeScript build check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Verify service worker excludes /api/*
        run: |
          test -f dist/sw.js
          grep -F "denylist:[/^\\/api\\//]" dist/sw.js
