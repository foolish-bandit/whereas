name: Verify and publish v0.1.0-alpha.1

on:
  push:
    branches:
      - ops/verify-release-v0.1.0-alpha.1

permissions:
  contents: write

concurrency:
  group: whereas-v0.1.0-alpha.1-release
  cancel-in-progress: false

env:
  TARGET_SHA: fd4b4b84760ea8c6a05eef7db1d68acd67740202
  RELEASE_TAG: v0.1.0-alpha.1

jobs:
  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Run TypeScript build check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Verify service worker excludes /api/*
        run: |
          test -f dist/sw.js
          grep -F "denylist:[/^\\/api\\//]" dist/sw.js

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests
        run: pytest

      - name: Run backend lint
        run: ruff check .

      - name: Audit backend dependencies
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2026-1325

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Validate docker-compose.yml
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: dummy
          MINIO_ROOT_PASSWORD: dummy
          DOCUSEAL_AUTH_BRIDGE_SECRET: dummy
          DOCUSEAL_SECRET_KEY_BASE: dummy
          SECRET_KEY: dummy
          WHEREAS_INSTANCE_KEY: dummy
          NANGO_ENCRYPTION_KEY: dummy
          NANGO_SECRET_KEY: dummy
          NANGO_WEBHOOK_SECRET: dummy
          NANGO_DASHBOARD_PASSWORD: dummy

  publish-release:
    needs:
      - frontend-test-build
      - backend-test
      - compose-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify main still points to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$TARGET_SHA"

      - name: Create or verify prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$TARGET_SHA"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Whereas v0.1.0-alpha.1" \
              --notes-file docs/releases/v0.1.0-alpha.1.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_SHA" \
              --title "Whereas v0.1.0-alpha.1" \
              --notes-file docs/releases/v0.1.0-alpha.1.md \
              --prerelease
          fi

      - name: Verify release target and prerelease state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$TARGET_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = "true"
