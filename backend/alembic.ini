# Alembic configuration for Whereas.
#
# The database URL is NOT set here; env.py resolves it from
# `app.core.config.get_settings()` at runtime so we don't have a second
# source of truth for connection strings. Leave `sqlalchemy.url` blank.
#
# Run from the `backend/` directory:
#     alembic upgrade head
#     alembic revision --autogenerate -m "description"
#
# See `backend/alembic/README.md` for the migration workflow.

[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = %(here)s/alembic

# `app.*` modules need to be importable from env.py. Running alembic from
# `backend/` puts that on the path; this just makes it explicit.
prepend_sys_path = .

# Sequential numeric prefixes (0001_, 0002_, ...) are baked into the
# revision IDs themselves; the filename mirrors the revision ID exactly,
# so history is human-readable in `ls alembic/versions/`.
file_template = %%(rev)s

path_separator = os

# Resolved by env.py from Settings.DATABASE_URL. Do not hardcode here.
sqlalchemy.url =


[post_write_hooks]
# Lint generated revisions with ruff. Keeps autogenerate output in line
# with the rest of the codebase without a separate manual pass.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
