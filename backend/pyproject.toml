[project]
name = "whereas"
version = "0.0.1"
description = "The open-source contract repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Zachary Brenner" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "litellm>=1.52",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "docling>=2.92,<3.0",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "pdf2image>=1.17",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "reportlab>=4.2",
    "moto[s3]>=5.0",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
# `backend/alembic/` is a config directory, not a project package — but ruff's
# isort sees the directory and would otherwise group the third-party `alembic`
# library import between sqlalchemy and our app.* imports. Tell it explicitly.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
# Both options require pytest-asyncio (declared in [project.optional-dependencies].dev).
# Running pytest from a Python that lacks pytest-asyncio prints
# "Unknown config option: asyncio_mode" and silently skips async test
# discovery — the fix is always to install dev extras into the active
# Python, never to drop these keys. See backend/README.md.
asyncio_mode = "auto"
# pytest-asyncio 1.x emits a DeprecationWarning when this is unset on
# strict-mode runs. Pin it explicitly so the choice is recorded in
# config rather than implied by the plugin's default.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project is named ``whereas`` but the code lives in ``app/``
# (matches the FastAPI convention used across the codebase). Without
# this, hatchling >= 1.21 refuses to build because its default file
# selection heuristic looks for a top-level directory matching the
# project name and finds none. Telling it explicitly which package
# to ship keeps ``pip install -e ".[dev]"`` working in CI.
[tool.hatch.build.targets.wheel]
packages = ["app"]
