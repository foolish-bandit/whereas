# Sample playbook for inbound vendor MSAs.
# Copy this into the UI or POST to /api/playbooks to create a new one.
# Customize ruthlessly. Whereas does not ship with opinionated defaults beyond this example.

name: "Vendor MSA - Standard Positions"
description: |
  Default positions for inbound vendor master service agreements. Tuned for a
  mid-market software buyer. Rules surface deviations; they do not auto-redline.

rules:
  # ----- Metadata-level rules (evaluated against extracted fields) -----

  - id: indemnification-cap-bounded
    kind: metadata
    field: indemnification_cap
    constraint: "Indemnification cap must be bounded (uncapped indemnification is a blocker). Acceptable forms: a multiple of fees, a hard dollar cap, or a per-claim cap."
    severity: blocker

  - id: governing-law-acceptable-jurisdictions
    kind: metadata
    field: governing_law
    constraint: "Governing law must be one of: Delaware, California, New York. Other US states are negotiable. Non-US jurisdictions require a senior approver."
    severity: medium

  - id: auto-renewal-notice-window
    kind: metadata
    field: auto_renewal
    constraint: "If the contract auto-renews, notice period to opt out must be 60 days or less. Anything longer is a high-severity deviation."
    severity: high

  - id: termination-for-convenience-required
    kind: metadata
    field: termination_for_convenience
    constraint: "Buyer must have termination for convenience with no more than 90 days notice."
    severity: high

  # ----- Clause-level rules (evaluated against full clause text via LLM) -----

  - id: limitation-of-liability-mutual-and-excludes-consequential
    kind: clause
    clause_type: Limitation_Of_Liability
    guideline: |
      The limitation of liability clause must:
        (a) be mutual (apply to both parties),
        (b) exclude consequential, indirect, special, and punitive damages,
        (c) preserve carveouts for indemnification, confidentiality breaches,
            and gross negligence/willful misconduct.
      Flag any clause that lacks any of these three elements.
    severity: high

  - id: ip-ownership-customer-data
    kind: clause
    clause_type: Ip_Ownership_Assignment
    guideline: "Customer data and any deliverables paid for by the customer must remain customer property. Vendor may have a license to use anonymized/aggregated data only with explicit consent."
    severity: high

  - id: confidentiality-survives-termination
    kind: clause
    clause_type: Non-Disclosure
    guideline: "Confidentiality obligations must survive termination for at least 3 years. Trade secrets must be protected indefinitely."
    severity: medium

  - id: assignment-requires-consent
    kind: clause
    clause_type: Anti-Assignment
    guideline: "Assignment by vendor must require buyer consent, except in the case of merger or sale of all/substantially all assets."
    severity: medium

  - id: warranty-services-professional-manner
    kind: clause
    clause_type: Warranty_Duration
    guideline: "Vendor must warrant that services will be performed in a professional and workmanlike manner consistent with industry standards. Pure 'as-is' service warranties are unacceptable."
    severity: high
