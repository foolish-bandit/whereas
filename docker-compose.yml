version: "3.9"

# Whereas + DocuSeal co-deployed (Pattern B integration).
# Both apps share a Postgres instance with separate databases.
# An auth bridge service issues short-lived JWTs accepted by DocuSeal.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: whereas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whereas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_MULTIPLE_DATABASES: whereas,docuseal,nango
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whereas}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: whereas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: whereas-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # GPU passthrough (uncomment if available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whereas-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whereas}:${POSTGRES_PASSWORD}@postgres:5432/whereas
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: whereas-documents
      LITELLM_PROVIDER: ${LITELLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      # Default is a <=2B-parameter model so the default deployment runs on
      # a single machine without a GPU (see docs/AI_SMALL_MODEL_STACK.md,
      # "Hard model-size rule"). Larger models (e.g. llama3.1:70b) are
      # opt-in for operators with capable hardware — set EXTRACTION_MODEL
      # to override.
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-qwen2.5:1.5b}
      DOCUSEAL_BASE_URL: http://docuseal:3000
      DOCUSEAL_AUTH_BRIDGE_SECRET: ${DOCUSEAL_AUTH_BRIDGE_SECRET:?DOCUSEAL_AUTH_BRIDGE_SECRET must be set}
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set - generate with: openssl rand -hex 32}"
      WHEREAS_INSTANCE_KEY: "${WHEREAS_INSTANCE_KEY:?WHEREAS_INSTANCE_KEY must be set - generate with: openssl rand -hex 32}"
      NANGO_BASE_URL: http://nango-server:3003
      NANGO_PUBLIC_URL: ${NANGO_PUBLIC_URL:-http://localhost:3003}
      # Both unset disables integrations gracefully. Set the secret +
      # webhook secret to the same values you pass to nango-server below.
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-}
      NANGO_WEBHOOK_SECRET: ${NANGO_WEBHOOK_SECRET:-}
      NANGO_ENABLED_PROVIDERS: ${NANGO_ENABLED_PROVIDERS:-google-drive,microsoft-onedrive,microsoft-sharepoint,gmail,outlook}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whereas-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_DOCUSEAL_BASE_URL: http://localhost:8081
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  docuseal:
    image: docuseal/docuseal:latest
    container_name: whereas-docuseal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-whereas}:${POSTGRES_PASSWORD}@postgres:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:?DOCUSEAL_SECRET_KEY_BASE must be set}
      # DocuSeal accepts external auth via a shared-secret JWT.
      # The Whereas backend mints these tokens via the auth-bridge endpoint.
      EXTERNAL_AUTH_SECRET: ${DOCUSEAL_AUTH_BRIDGE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:3000"
    volumes:
      - docuseal_data:/data
    restart: unless-stopped

  # Nango — open-source unified API for third-party integrations.
  # Runs as a peer service like DocuSeal; tokens never reach the
  # Whereas backend. Two containers: ``nango-server`` is the HTTP
  # surface (Connect UI + REST API + webhook out), ``nango-jobs``
  # runs the background sync workers. Both share a Postgres database
  # alongside Whereas / DocuSeal via POSTGRES_MULTIPLE_DATABASES.
  #
  # Provider OAuth credentials (Google client id/secret, Microsoft
  # tenant credentials, etc.) are configured via the Nango admin UI
  # at NANGO_PUBLIC_URL once the container is up. Until they are,
  # the Whereas backend reports the corresponding providers as
  # unavailable.
  nango-server:
    image: nangohq/nango-server:latest
    container_name: whereas-nango-server
    environment:
      NANGO_DB_HOST: postgres
      NANGO_DB_PORT: 5432
      NANGO_DB_USER: ${POSTGRES_USER:-whereas}
      NANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NANGO_DB_NAME: nango
      NANGO_DB_SSL: "false"
      NANGO_ENCRYPTION_KEY: "${NANGO_ENCRYPTION_KEY:?NANGO_ENCRYPTION_KEY must be set - generate with: openssl rand -base64 32}"
      NANGO_SECRET_KEY: "${NANGO_SECRET_KEY:?NANGO_SECRET_KEY must be set - generate with: openssl rand -hex 32}"
      NANGO_SERVER_URL: ${NANGO_PUBLIC_URL:-http://localhost:3003}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_URL:-http://localhost:3003}
      NANGO_WEBHOOK_SECRET: "${NANGO_WEBHOOK_SECRET:?NANGO_WEBHOOK_SECRET must be set - generate with: openssl rand -hex 32}"
      FLAG_AUTH_ENABLED: "false"
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:-admin}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:?NANGO_DASHBOARD_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"
    restart: unless-stopped

  nango-jobs:
    image: nangohq/nango-jobs:latest
    container_name: whereas-nango-jobs
    environment:
      NANGO_DB_HOST: postgres
      NANGO_DB_PORT: 5432
      NANGO_DB_USER: ${POSTGRES_USER:-whereas}
      NANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NANGO_DB_NAME: nango
      NANGO_DB_SSL: "false"
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY}
      NANGO_SERVER_URL: http://nango-server:3003
      RECORDS_DATABASE_URL: postgres://${POSTGRES_USER:-whereas}:${POSTGRES_PASSWORD}@postgres:5432/nango
    depends_on:
      nango-server:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  docuseal_data:
