version: "3.9"

# Whereas + DocuSeal co-deployed (Pattern B integration).
# Both apps share a Postgres instance with separate databases.
# An auth bridge service issues short-lived JWTs accepted by DocuSeal.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: whereas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whereas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_MULTIPLE_DATABASES: whereas,docuseal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whereas}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: whereas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: whereas-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # GPU passthrough (uncomment if available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whereas-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whereas}:${POSTGRES_PASSWORD}@postgres:5432/whereas
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: whereas-documents
      LITELLM_PROVIDER: ${LITELLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-llama3.1:70b}
      DOCUSEAL_BASE_URL: http://docuseal:3000
      DOCUSEAL_AUTH_BRIDGE_SECRET: ${DOCUSEAL_AUTH_BRIDGE_SECRET:?DOCUSEAL_AUTH_BRIDGE_SECRET must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set - generate with: openssl rand -hex 32}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whereas-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_DOCUSEAL_BASE_URL: http://localhost:8081
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  docuseal:
    image: docuseal/docuseal:latest
    container_name: whereas-docuseal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-whereas}:${POSTGRES_PASSWORD}@postgres:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:?DOCUSEAL_SECRET_KEY_BASE must be set}
      # DocuSeal accepts external auth via a shared-secret JWT.
      # The Whereas backend mints these tokens via the auth-bridge endpoint.
      EXTERNAL_AUTH_SECRET: ${DOCUSEAL_AUTH_BRIDGE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:3000"
    volumes:
      - docuseal_data:/data

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  docuseal_data:
