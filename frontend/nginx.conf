# Static-file server for the Whereas frontend bundle.
#
# - History API fallback so client-side routes (e.g. /contracts/:id) resolve
#   to index.html when the user reloads or arrives via a deep link.
# - No telemetry, no upstream proxying. The frontend talks to the backend
#   directly via VITE_API_BASE_URL at runtime.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
