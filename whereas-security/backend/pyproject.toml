[project]
name = "whereas"
version = "0.0.1"
description = "The open-source contract repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Zachary Brenner" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "litellm>=1.52",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "pdf2image>=1.17",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
